<style>

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);min-height:105px}.kpi .icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;float:left;margin-right:9px;font-size:18px}.blue{background:#e9f2ff}.green{background:#e4f7ee}.yellow{background:#fff4d9}.red{background:#ffe7e9}.cyan{background:#e5f8fb}.kpi .lbl{font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;padding-top:3px}.kpi .val{font-size:23px;font-weight:900;margin-top:5px}.kpi .sub{font-size:8px;color:var(--muted);margin-top:4px;clear:both}

.mobile{display:none}.moduleHead{display:flex;gap:10px;align-items:center;margin-bottom:14px}.mi{width:42px;height:42px;background:#e9f2ff;border-radius:10px;display:grid;place-items:center;font-size:20px}.moduleHead h2{font-size:17px;margin:0}.moduleHead p{font-size:9px;color:var(--muted);margin:3px 0}.actions{margin-left:auto}.btn{border:0;background:var(--primary2);color:#fff;border-radius:8px;padding:8px 11px;font-size:9px;font-weight:800;cursor:pointer}.btn.alt{background:#eef3f8;color:#23415e}
.empty{text-align:center;padding:25px;color:var(--muted);font-size:10px}.toast{position:fixed;right:18px;bottom:18px;background:#102a43;color:#fff;padding:10px 14px;border-radius:8px;z-index:100;font-size:10px}.hidden{display:none}

@media(max-width:760px){.trend-chart{display:block!important;position:relative!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-x!important}.trend-chart .trend-col{display:inline-flex!important;vertical-align:bottom!important;flex:none!important;width:74px!important;min-width:74px!important;margin-right:9px!important}}

:root{--nav:#071f35;--nav2:#103b5d;--primary:#1268c4;--primary2:#0b57a4;--bg:#f2f6fb;--line:#e1e9f2;--r:16px;--shadow:0 10px 28px rgba(14,43,74,.075)}

.logo{box-shadow:0 6px 18px rgba(255,214,46,.18)}
.nav button{transition:background .18s ease,transform .18s ease}

 <header class="top">

<script>
const MENUS=[['home','🏠','Beranda'],['teknik','🔧','Teknik Jaringan'],['transaksi','⚡','Transaksi Energi'],['pelayanan','👥','Pelayanan Pelanggan'],['k3l','🦺','K3L'],['pengusahaan','💰','Pengusahaan'],['laporan','📋','Laporan'],['rekap','📊','Rekap Data'],['pendukung','🧰','Pendukung Data']];
let D=null,CUR='home';
function boot(){
 document.getElementById('nav').innerHTML=MENUS.map(m=>`<button id="n-${m[0]}" onclick="module('${m[0]}')"><i>${m[1]}</i>${m[2]}</button>`).join('');
 document.getElementById('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'short',year:'numeric'});
 load();
}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function module(m){
 CUR=m;
 const map={home:'semua',laporan:'semua',rekap:'semua'};
 document.getElementById('bidang').value=map[m]||m;
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 const b=document.getElementById('n-'+m);if(b)b.classList.add('active');
 if(innerWidth<=720)document.getElementById('side').classList.remove('open');
 render();
}
function f(){return{year:year.value,month:month.value,status:status.value}}
function apiGet(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const q=new URLSearchParams(params||{});q.set('callback',cb);window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('API tidak dapat diakses'))};s.src='https://script.google.com/macros/s/AKfycbysDV8suT1MBJF8LiX4zxNHUzZdnP9FT9BpnaI01QjnFDznRIFyZlPSD-5kRb5k0TL_aQ/exec?'+q.toString();document.head.appendChild(s)})}
async function apiData(){return apiGet({api:'getData'})}
async function load(){try{const d=await apiData();D=d;fill();document.getElementById('updated').textContent='Data diperbarui '+(d.updated||'');uName.textContent=(d.user&&d.user.nama)||'Pengguna';uRole.textContent=((d.user&&d.user.role)||'VIEWER')+' • '+((d.user&&d.user.bidang)||'Semua');render()}catch(e){toast('Gagal: '+e.message)}}

 if(year.options.length===1)(D.years||[]).forEach(x=>year.add(new Option(x,x)));
 if(month.options.length===1)(D.months||[]).slice(1).forEach(x=>month.add(new Option(x.t,x.v)));
}
function render(){
 if(!D)return;
 if(['home','laporan','rekap'].includes(CUR))home();else if(CUR==='pendukung')renderSupport();else mod(CUR);
}

function k(ic,cl,l,v,s){return`<div class="kpi"><div class="icon ${cl}">${ic}</div><div class="lbl">${l}</div><div class="val">${typeof v==='number'?fmt(v):v}</div><div class="sub">${s}</div></div>`}
function trendChart(a){
 const mx=Math.max(1,...a.map(x=>Math.max(x.total,1)));
 return `<div class="chart">${a.map(x=>`<div class="monthcol"><div class="stackwrap">
 <div class="bar done" style="height:${x.done/mx*100}%"></div><div class="bar proc" style="height:${x.process/mx*100}%"></div><div class="bar pend" style="height:${x.pending/mx*100}%"></div>
 </div><small>${x.label}</small></div>`).join('')}</div><div class="legend"><span><b style="background:#2aaa76"></b>Selesai</span><span><b style="background:#f0b12b"></b>Proses</span><span><b style="background:#df5962"></b>Tertunda</span></div>`;
}
function areas(s){
 const a=[['Teknik Jaringan',s.teknik],['Transaksi Energi',s.transaksi],['Pelayanan Pelanggan',s.pelayanan],['K3L',s.k3l]];
 return a.map(x=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:10px"><b>${x[0]}</b><span>${x[1].rate.toFixed(0)}% selesai</span></div><div class="progress"><span style="width:${x[1].rate}%"></span></div><div class="muted">${x[1].total} data • ${x[1].selesai} selesai • ${x[1].proses} proses • ${x[1].belum} tertunda</div></div>`).join('');
}
function donut(t,d,p,x){
 const a=t?d/t*100:0,b=t?p/t*100:0,c=t?x/t*100:0;
 return `<div class="donutrow"><div class="donut" style="background:conic-gradient(#2aaa76 0 ${a}%,#f0b12b ${a}% ${a+b}%,#df5962 ${a+b}% 100%)"><div class="dc">${t}<small>Total</small></div></div><div><div class="srow"><span class="miniDot" style="background:#2aaa76"></span>Selesai <b>${a.toFixed(0)}%</b></div><div class="srow"><span class="miniDot" style="background:#f0b12b"></span>Proses <b>${b.toFixed(0)}%</b></div><div class="srow"><span class="miniDot" style="background:#df5962"></span>Tertunda <b>${c.toFixed(0)}%</b></div></div></div>`;
}
function business(s){
 const p=Math.min(100,s.rate||0);
 return `<div class="business"><div class="metric"><span>Target</span><strong>${fmt(s.target)}</strong></div><div class="metric"><span>Realisasi</span><strong>${fmt(s.realisasi)}</strong></div><div class="track"><span style="width:${p}%"></span></div><div class="muted" style="margin-top:7px">Pencapaian target: <b>${s.rate.toFixed(1)}%</b></div></div>`;
}
function notices(a){if(!a.length)return'<div class="empty">Belum ada informasi.</div>';return a.map(x=>`<div class="notice"><b>📣 ${esc(x.Judul||'Informasi')}</b><small>${esc(x.Isi||'')}</small></div>`).join('')}
function latest(a){if(!a.length)return'<div class="empty">Belum ada aktivitas.</div>';return`<div style="overflow:auto"><table><thead><tr><th>Tanggal</th><th>Bidang</th><th>Kegiatan</th><th>Lokasi</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.tanggal}</td><td>${x.bidang}</td><td>${esc(x.kegiatan)}</td><td>${esc(x.lokasi)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div>`}

function barList_(arr,titleText){
  arr=arr||[];
  const max=Math.max(1,...arr.map(a=>Number(a.value)||0));
  return `<div class="head"><h3>${titleText}</h3><span>${arr.length} kelompok</span></div>`+
    (arr.length?`<div class="pe-bars">${arr.slice(0,12).map(a=>`<div class="pe-bar-row"><div><span>${esc(a.label)}</span><b>${fmtInt_(a.value)}</b></div><div class="pe-track"><i style="width:${Math.max(2,(a.value/max)*100)}%"></i></div></div>`).join('')}`:`<div class="empty">Belum ada data.</div>`);
}

function pengusahaanPenjualanTable(rows){
  if(!rows.length)return'<div class="empty">Belum ada data penjualan.</div>';
  const cols=['BULAN','JUMLAH PELANGGAN','DAYA TERSAMBUNG','PENJUALAN (KWH)','RP PENDAPATAN','GROWTH KWH YOY'];
  return `<div style="overflow:auto"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice().reverse().slice(0,24).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function peKpi(icon,label,value,sub){
  return `<div class="pe-kpi"><div class="pe-icon">${icon}</div><div><small>${label}</small><strong>${value}</strong><em>${sub}</em></div></div>`;
}

function fmtInt_(v){return Math.round(Number(v)||0).toLocaleString('id-ID');}
function formatBig_(v){
  const n=Number(v)||0;
  return n.toLocaleString('id-ID',{maximumFractionDigits:2});
}
function formatShort_(v){
  const n=Number(v)||0;
  const a=Math.abs(n);
  if(a>=1000000000)return (n/1000000000).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';
  if(a>=1000000)return (n/1000000).toLocaleString('id-ID',{maximumFractionDigits:2})+' Jt';
  if(a>=1000)return (n/1000).toLocaleString('id-ID',{maximumFractionDigits:1})+' Rb';
  return n.toLocaleString('id-ID',{maximumFractionDigits:2});
}
function shortMonth_(s){
  const z=String(s||'').split(' ')[0].toLowerCase();
  const m={januari:'Jan',februari:'Feb',maret:'Mar',april:'Apr',mei:'Mei',juni:'Jun',juli:'Jul',agustus:'Agu',september:'Sep',oktober:'Okt',november:'Nov',desember:'Des'};
  return m[z]||String(s||'').slice(0,6);
}

function table(m,r){
 if(!r.length)return'<div class="empty">Tidak ada data untuk filter yang dipilih.</div>';
 const c={teknik:['ID','Tanggal','Penyulang','Lokasi','Jenis Pekerjaan','Status','Petugas'],transaksi:['ID','Tanggal','ID Pelanggan','Nomor Meter','Merk Meter','Kegiatan','Status','Petugas'],pelayanan:['ID','Tanggal','ID Pelanggan','Jenis Pelayanan','Nama Pelanggan','Status','Petugas'],k3l:['ID','Tanggal','Kegiatan','Lokasi','Status','Temuan','Tindak Lanjut'],pengusahaan:['ID','Tanggal','Indikator','Target','Realisasi','Satuan','Persentase']}[m];
 return`<div style="overflow:auto"><table><thead><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.slice(0,200).map(x=>`<tr>${c.map(y=>`<td>${y==='Status'?badge(x[y]):esc(x[y]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function badge(s){const l=String(s||'').toLowerCase();let c=l.includes('selesai')?'bg':l.includes('proses')?'by':l.includes('belum')?'br':'bb';return`<span class="badge ${c}">${esc(s||'-')}</span>`}
function fmt(n){return Number(n||0).toLocaleString('id-ID')}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}

let uploadCancelled=false;
function openUpload(){const el=document.getElementById('mainFileInput');if(el)el.click();else{const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>handleFiles(i.files);i.click();}}
function setProgress(p,msg){
  let t=document.getElementById('uploadStatus'); if(!t){t=document.createElement('div');t.id='uploadStatus';t.style='position:fixed;right:18px;bottom:18px;background:#102a43;color:#fff;padding:10px 14px;border-radius:9px;z-index:100;font-size:11px;box-shadow:0 8px 25px rgba(0,0,0,.2)';document.body.appendChild(t)}
  t.textContent=Math.round(p)+'% — '+msg; t.style.display='block'; if(p>=100||p<=0)setTimeout(()=>t.style.display='none',1800);
}
function handleFiles(files){
  if(!files||!files.length)return;
  const file=files[0],ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['xlsx','xls','csv'].includes(ext)){toast('File harus .xlsx, .xls atau .csv');return}
  uploadCancelled=false; setProgress(3,'Membaca '+file.name+'...');
  if(ext==='csv'){const fr=new FileReader();fr.onload=()=>{const lines=String(fr.result).split(/\r?\n/).filter(Boolean);uploadBatches([{sheet:'KPI',rows:lines.map(x=>x.split(','))}]);};fr.readAsText(file);return;}
  if(typeof XLSX==='undefined'){toast('Library Excel belum siap. Coba refresh.');return}
  const fr=new FileReader();
  fr.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:'array',raw:false});
    const map={KPI:'KPI',JARINGAN:'teknik',TEKNIK:'teknik',TRANSAKSI_ENERGI:'transaksi',TRANSAKSI:'transaksi',PELAYANAN_PELANGGAN:'pelayanan',PELAYANAN:'pelayanan',K3L:'k3l',PENJUALAN:'PENJUALAN',PLGTARIF:'PLGTARIF',PLGKATEGORI:'PLGKATEGORI',PLGKEC:'PLGKEC',PLGKECAMATAN:'PLGKEC',ASET:'ASET',SDM:'SDM',TAD:'TAD'};
    const groups=[];

async function uploadBatches(groups){
  if(!groups.length){toast('Tidak ada sheet yang dikenali.');return}
  const jobs=[];groups.forEach(g=>{for(let i=0;i<g.rows.length;i+=100)jobs.push({sheet:g.sheet,rows:g.rows.slice(i,i+100)})});
  for(let i=0;i<jobs.length;i++){
    if(uploadCancelled){setProgress(0,'Upload dibatalkan');return}
    const j=jobs[i];setProgress(i/jobs.length*100,'Mengirim '+j.sheet+' batch '+(i+1)+'/'+jobs.length);
    try{await apiPost({api:'appendRows',sheet:j.sheet,rows:j.rows});}catch(e){toast('Upload gagal: '+e.message);return}
    await new Promise(r=>setTimeout(r,80));
  }
  setProgress(100,'Upload selesai — memuat data terbaru');setTimeout(load,700);
}
